[build-system]
requires = [
    "scikit-build-core>=0.5.0",
    "pybind11>=2.12.0",
    "numpy",
]
build-backend = "scikit_build_core.build"

[project]
name = "hoomd"
dynamic = ["version"]
description = "Molecular dynamics and Monte Carlo soft matter simulation on GPUs."
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Joshua A. Anderson", email = "joaander@umich.edu" },
]
dependencies = [
    "numpy",
    "gsd>=3.0.0",
    "rowan>=1.2.0",
    "h5py",
]

[tool.scikit-build]
cmake.build-type = "Release"
wheel.packages = ["hoomd"]
sdist.include = ["hoomd/extern/*"] # Ensure external submodules are included if present
editable.mode = "redirect"
build-dir = "build/{wheel_tag}"

[tool.pytest.ini_options]
testpaths = ["hoomd"]
addopts = "--import-mode=importlib"
